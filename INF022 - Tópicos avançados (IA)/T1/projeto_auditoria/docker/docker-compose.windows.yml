# Sobrescrita para Windows (Docker Desktop + WSLg). Uso a partir da raiz do projeto:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.windows.yml build
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.windows.yml run --rm auditoria-app
services:
  auditoria-app:
    # Variáveis de ambiente exigidas pelo subsistema gráfico WSLg no Windows
    environment:
      # Define explicitamente o display X11 padrão exposto pelo WSLg
      - DISPLAY=:0
      # Define o socket Wayland do WSLg (fallback gráfico moderno do Windows 11)
      - WAYLAND_DISPLAY=wayland-0
      # Diretório de tempo de execução exigido por bibliotecas gráficas no Linux do contêiner
      - XDG_RUNTIME_DIR=/tmp

    volumes:
      # Mantém o salvamento automático na pasta Downloads real do usuário
      - "${USERPROFILE}/Downloads:/root/Downloads"
      # Expõe toda a pasta do usuário (Documentos, Desktop, OneDrive, etc.) em /host_home (somente leitura)
      - "${USERPROFILE}:/host_home:ro"
      # Aponta para o caminho interno onde o Docker Desktop monta o socket gráfico X11 do WSLg
      - "/run/desktop/mnt/host/wslg/.X11-unix:/tmp/.X11-unix:rw"
