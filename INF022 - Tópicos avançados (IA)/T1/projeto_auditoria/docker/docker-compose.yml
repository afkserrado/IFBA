# Configuração comum a todos os sistemas operacionais (sem caminhos específicos de máquina).
# Deve ser usada em conjunto com docker-compose.linux.yml ou docker-compose.windows.yml.

# Define os contêineres (serviços) que compõem a aplicação
services:
  auditoria-app:
    # Constrói a imagem usando o Dockerfile em docker/ com contexto na raiz do projeto (..)
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # Nome fixo do contêiner para facilitar inspeção e logs
    container_name: projeto_auditoria

    # Variáveis de ambiente injetadas dentro do contêiner
    environment:
      # Informa ao config.py a URL do Ollama rodando na máquina hospedeira (host)
      # (no Linux, o config.py também tenta http://localhost:11434, que funciona com a rede do host)
      - OLLAMA_HOST_URL=http://host.docker.internal:11434

    # Mapeia o domínio 'host.docker.internal' para o IP real do host
    # (No Docker Desktop do Windows isso já existe por padrão; no Linux Engine essa linha garante a compatibilidade)
    extra_hosts:
      - "host.docker.internal:host-gateway"
