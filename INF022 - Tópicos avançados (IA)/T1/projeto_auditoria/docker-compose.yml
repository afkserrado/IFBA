# Define os contêineres (serviços) que compõem a aplicação
services:
  auditoria-app:
    # Constrói a imagem usando o Dockerfile presente no diretório atual (.)
    build: .
    # Nome fixo do contêiner para facilitar inspeção e logs
    container_name: projeto_auditoria

    # Variáveis de ambiente injetadas dentro do contêiner Linux
    environment:
      # Repassa o identificador da tela gráfica do host para o Tkinter; se não existir, usa ':0'
      - DISPLAY=${DISPLAY:-:0}
      # Informa ao config.py a URL do Ollama rodando na máquina hospedeira (host)
      - OLLAMA_HOST_URL=http://host.docker.internal:11434

    # Mapeia o domínio 'host.docker.internal' para o IP real do host no Linux
    # (No Docker Desktop do Windows isso já existe por padrão; no Linux Engine essa linha garante a compatibilidade)
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Mapeamento de pastas/sockets entre a máquina física (host) e o contêiner
    volumes:
      # Mantém o salvamento automático na pasta Downloads real (usa HOME no Linux ou USERPROFILE no Windows)
      - "${HOME:-${USERPROFILE}}/Downloads:/root/Downloads"
      # Expõe toda a pasta pessoal do usuário (Documentos, Área de Trabalho, etc.) em /host_home
      - "${HOME:-${USERPROFILE}}:/host_home:ro"
      # Opcional: expõe a partição compartilhada caso use no Kubuntu
      - "/mnt/Arquivos_D0P6LA:/host_arquivos:ro"
      # Conecta o socket do servidor gráfico X11 do Linux ao contêiner para exibir a janela Tkinter (rw = leitura e escrita)
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"