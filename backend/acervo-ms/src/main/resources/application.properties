spring.application.name=acervo-ms
server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5433/biblioteca?currentSchema=acervo
spring.datasource.username=admin
spring.datasource.password=biblioteca
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=acervo

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=biblioteca