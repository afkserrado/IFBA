spring.application.name=emprestimos-ms
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/biblioteca?currentSchema=emprestimos
spring.datasource.username=admin
spring.datasource.password=biblioteca
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=emprestimos

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=biblioteca

microservice.usuarios.url=http://localhost:8081
microservice.acervo.url=http://localhost:8082

security.public-paths=/swagger-ui/**,/v3/api-docs/**
security.jwt-secret=minha-chave-secreta-super-protegida-com-mais-de-trinta-e-dois-bytes

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.web.FilterChainProxy=TRACE