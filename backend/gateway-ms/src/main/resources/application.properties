server.port=8080
spring.application.name=gateway-ms

# Vincula a chave do JWT ao seu arquivo .env
jwt.secret=${JWT_SECRET}

# ====================================================================
# ROTAS DO MICROSERVIÇO DE USUÁRIOS (usuarios-ms: porta 8081)
# ====================================================================

# Rota 1: Login público (Sem filtro de segurança)
spring.cloud.gateway.routes[0].id=login-route
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/login

# Rota 2: Cadastro público de usuário (Sem filtro - o service barra se tentarem forçar ADMIN)
spring.cloud.gateway.routes[1].id=cadastro-usuario-route
spring.cloud.gateway.routes[1].uri=http://localhost:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/usuarios
spring.cloud.gateway.routes[1].predicates[1]=Method=POST

# Rota 3: Operações gerais de perfil (Qualquer usuário autenticado acessa)
spring.cloud.gateway.routes[2].id=crud-usuarios-geral-route
spring.cloud.gateway.routes[2].uri=http://localhost:8081
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/usuarios/**
spring.cloud.gateway.routes[2].predicates[1]=Method=GET, PUT
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

# Rota 4: Deleção de usuário (Apenas quem tem papel ADMIN acessa)
spring.cloud.gateway.routes[3].id=delete-usuarios-admin-route
spring.cloud.gateway.routes[3].uri=http://localhost:8081
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/usuarios/**
spring.cloud.gateway.routes[3].predicates[1]=Method=DELETE
spring.cloud.gateway.routes[3].filters[0].name=AuthenticationFilter
spring.cloud.gateway.routes[3].filters[0].args.rolesPermitidas=ADMIN


# ====================================================================
# ROTAS DO MICROSERVIÇO DE EMPRÉSTIMOS (emprestimos-ms: porta 8082)
# ====================================================================

# Rota 5: Controle de empréstimos (Qualquer usuário autenticado acessa)
spring.cloud.gateway.routes[4].id=emprestimos-route
spring.cloud.gateway.routes[4].uri=http://localhost:8082
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/emprestimos/**
spring.cloud.gateway.routes[4].filters[0]=AuthenticationFilter


# ====================================================================
# ROTAS DO MICROSERVIÇO DE ACERVO (acervo-ms: porta 8083)
# ====================================================================

# Rota 6: Consulta de livros (Pública para qualquer visitante)
spring.cloud.gateway.routes[5].id=acervo-consulta-route
spring.cloud.gateway.routes[5].uri=http://localhost:8083
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/livros/**
spring.cloud.gateway.routes[5].predicates[1]=Method=GET

# Rota 7: Modificação do acervo (Cadastrar, editar e excluir livros - Exclusivo ADMIN)
spring.cloud.gateway.routes[6].id=acervo-modificacao-route
spring.cloud.gateway.routes[6].uri=http://localhost:8083
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/livros/**
spring.cloud.gateway.routes[6].predicates[1]=Method=POST, PUT, DELETE
spring.cloud.gateway.routes[6].filters[0].name=AuthenticationFilter
spring.cloud.gateway.routes[6].filters[0].args.rolesPermitidas=ADMIN
