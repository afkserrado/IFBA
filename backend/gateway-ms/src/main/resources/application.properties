server.port=8080
spring.application.name=gateway-ms

# ====================================================================
# ROTAS DO MICROSERVIÇO DE USUÁRIOS
# ====================================================================

# Login
spring.cloud.gateway.routes[0].id=login-route
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/login

# Cadastro
spring.cloud.gateway.routes[1].id=cadastro-usuario-route
spring.cloud.gateway.routes[1].uri=http://localhost:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/usuarios
spring.cloud.gateway.routes[1].predicates[1]=Method=POST

# Demais operações
spring.cloud.gateway.routes[2].id=usuarios-route
spring.cloud.gateway.routes[2].uri=http://localhost:8081
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/usuarios/**

# ====================================================================
# ROTAS DO MICROSERVIÇO DE EMPRÉSTIMOS
# ====================================================================

spring.cloud.gateway.routes[3].id=emprestimos-route
spring.cloud.gateway.routes[3].uri=http://localhost:8082
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/emprestimos/**

# ====================================================================
# ROTAS DO MICROSERVIÇO DE ACERVO
# ====================================================================

spring.cloud.gateway.routes[4].id=acervo-route
spring.cloud.gateway.routes[4].uri=http://localhost:8083
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/livros/**

# ====================================================================
# CONFIGURAÇÃO DE CORS
# ====================================================================

spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*