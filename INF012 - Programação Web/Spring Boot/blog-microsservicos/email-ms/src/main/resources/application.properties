# ============================
# Identificação da aplicação
# ============================

# Nome da aplicação dentro do ambiente Spring
spring.application.name=email-ms

# ============================
# Configuração do banco PostgreSQL
# ============================

# Endereço do banco PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres

# Usuário do banco de dados
spring.datasource.username=${DB_USER}

# Senha do banco de dados
spring.datasource.password=${DB_PASSWORD}

# Driver JDBC usado para conexão com o PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================
# Configuração do Hibernate
# ============================

# Dialeto SQL usado pelo Hibernate para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Atualiza automaticamente as tabelas conforme as entidades JPA
spring.jpa.hibernate.ddl-auto=update

# Exibe no console os comandos SQL executados
spring.jpa.show-sql=true

# ============================
# Configuração do servidor SMTP
# ============================

# Servidor responsável pelo envio dos e-mails
spring.mail.host=smtp.gmail.com

# Porta de comunicação com o servidor SMTP
spring.mail.port=587

# ============================
# Credenciais de acesso
# ============================

# Conta utilizada para enviar os e-mails
spring.mail.username=${MAIL_USERNAME}

# Senha de aplicativo da conta
spring.mail.password=${MAIL_PASSWORD}

# ============================
# Segurança da conexão
# ============================

# Exige autenticação no servidor SMTP
spring.mail.properties.mail.smtp.auth=true

# Habilita criptografia STARTTLS
spring.mail.properties.mail.smtp.starttls.enable=true
  
# ============================  
# Configuração do Eureka Client  
# ============================  
  
# URL do Eureka Server utilizada para registrar e localizar serviços  
eureka.client.serviceUrl.defaultZone=http://localhost:8081/eureka/
  
# ============================  
# Configuração da instância  
# ============================  
  
# Permite que o Spring escolha automaticamente uma porta disponível  
server.port=0
  
# Faz com que o serviço utilize seu endereço IP ao se registrar no Eureka  
eureka.instance.prefer-ip-address=true