# ============================
# Configuração do servidor Eureka
# ============================

# Porta onde o Eureka Server será executado
server.port=8081

# Nome da aplicação dentro do ambiente Spring
spring.application.name=server

# ============================
# Configuração do Eureka Server
# ============================

# Impede que o próprio Eureka Server se registre como cliente
eureka.client.register-with-eureka=false

# Impede que o Eureka Server tente buscar registros de outros servidores Eureka
eureka.client.fetch-registry=false

# URL utilizada pelos clientes para localizar o Eureka Server
eureka.client.serviceUrl.defaultZone=http://localhost:8081/eureka