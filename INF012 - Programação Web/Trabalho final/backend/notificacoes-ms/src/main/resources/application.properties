# ============================
# Identificação da aplicação
# ============================

# Nome do microsserviço
spring.application.name=notificacoes-ms

# Porta HTTP da aplicação
server.port=8084

# ============================
# RabbitMQ
# ============================

# Servidor RabbitMQ
spring.rabbitmq.host=localhost

# Porta AMQP
spring.rabbitmq.port=5672

# Credenciais RabbitMQ
spring.rabbitmq.username=admin
spring.rabbitmq.password=biblioteca

# ============================
# Comunicação entre microsserviços
# ============================

# URL do microsserviço de e-mail
microservice.email.url=http://localhost:8085

# ============================
# Configuração de E-mail
# ============================

# Destinatário das notificações
email.destinatario=${EMAIL_NOTIFICACAO_DESTINO}

# ============================
# Variáveis de ambiente
# ============================

# Carrega o .env da raiz do projeto
spring.config.import=optional:file:../../.env[.properties]

# ============================
# Autenticação entre microsserviços
# ============================

# URL do usuarios-ms.
# No Docker, será sobrescrita para http://usuarios-ms:8081.
microservice.usuarios.url=http://localhost:8081

# Credenciais da conta utilizada pelo notificacoes-ms para obter o JWT.
# A conta precisa possuir o papel ADMIN, exigido pelo email-ms.
# Os valores serão fornecidos por variáveis de ambiente.
notificacoes.service.email=${NOTIFICACOES_SERVICE_EMAIL}
notificacoes.service.password=${NOTIFICACOES_SERVICE_PASSWORD}