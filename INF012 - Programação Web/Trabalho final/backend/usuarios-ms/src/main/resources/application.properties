# ============================
# Identificação da aplicação
# ============================

# Nome do microsserviço
spring.application.name=usuarios-ms

# Porta HTTP da aplicação
server.port=8081

# ============================
# Banco de dados PostgreSQL
# ============================

# URL de conexão com o banco
spring.datasource.url=jdbc:postgresql://localhost:5433/biblioteca?currentSchema=usuarios

# Credenciais do banco
spring.datasource.username=admin
spring.datasource.password=biblioteca

# Driver JDBC
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================
# JPA / Hibernate
# ============================

# Atualiza automaticamente o schema conforme as entidades
spring.jpa.hibernate.ddl-auto=update

# Exibe SQL gerado pelo Hibernate
spring.jpa.show-sql=true

# Formata os comandos SQL exibidos no console
spring.jpa.properties.hibernate.format_sql=true

# Schema padrão utilizado pelo Hibernate
spring.jpa.properties.hibernate.default_schema=usuarios

# ============================
# RabbitMQ
# ============================

# Servidor RabbitMQ
spring.rabbitmq.host=localhost

# Porta AMQP
spring.rabbitmq.port=5672

# Credenciais RabbitMQ
spring.rabbitmq.username=admin
spring.rabbitmq.password=biblioteca

# ============================
# Comunicação entre microsserviços
# ============================

# URL do microsserviço de empréstimos
microservice.emprestimos.url=localhost:8083

# ============================
# Logs Feign Client
# ============================

logging.level.br.edu.ifba.usuarios_ms.client=DEBUG
logging.level.feign=DEBUG

# ============================
# Variáveis de ambiente
# ============================

# Carrega o .env da raiz do projeto
spring.config.import=optional:file:../../.env[.properties]