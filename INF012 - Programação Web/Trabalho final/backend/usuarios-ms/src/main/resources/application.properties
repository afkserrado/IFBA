# ============================
# Identificação da aplicação
# ============================

# Nome do microsserviço
spring.application.name=usuarios-ms

# Porta HTTP da aplicação
server.port=8081

# ============================
# Banco de dados PostgreSQL
# ============================

# URL de conexão com o banco
spring.datasource.url=jdbc:postgresql://localhost:5433/biblioteca?currentSchema=usuarios

# Credenciais do banco
spring.datasource.username=admin
spring.datasource.password=biblioteca

# Driver JDBC
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================
# JPA / Hibernate
# ============================

# Atualiza automaticamente o schema conforme as entidades
spring.jpa.hibernate.ddl-auto=update

# Exibe SQL gerado pelo Hibernate
spring.jpa.show-sql=true

# Formata os comandos SQL exibidos no console
spring.jpa.properties.hibernate.format_sql=true

# Schema padrão utilizado pelo Hibernate
spring.jpa.properties.hibernate.default_schema=usuarios

# ============================
# RabbitMQ
# ============================

# Servidor RabbitMQ
spring.rabbitmq.host=localhost

# Porta AMQP
spring.rabbitmq.port=5672

# Credenciais RabbitMQ
spring.rabbitmq.username=admin
spring.rabbitmq.password=biblioteca

# ============================
# Comunicação entre microsserviços
# ============================

# URL do microsserviço de empréstimos
services.emprestimos.url=${SERVICES_EMPRESTIMOS_URL:http://localhost:8083}

# ============================
# Segurança / JWT
# ============================

# Emissor do token. Ajuda a identificar quem gerou o JWT.
app.security.jwt.issuer=usuarios-ms

# Tempo de validade do token de acesso, em minutos.
app.security.jwt.expiracao-minutos=60

# Chave secreta usada para assinar e validar JWTs com HS256.
# Deve ter pelo menos 32 caracteres para gerar 256 bits.
app.security.jwt.secret=${JWT_SECRET:}

# ============================
# Usuário ADMIN inicial
# ============================

app.admin.cpf=${ADMIN_CPF:00000000000}
app.admin.nome=${ADMIN_NOME:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@biblioteca.com}
app.admin.senha=${ADMIN_SENHA:}