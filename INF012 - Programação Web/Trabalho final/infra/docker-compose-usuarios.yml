# Define os serviços (contêineres) específicos do microsserviço de usuários.
services:

  # Serviço responsável pelo gerenciamento de usuários.
  usuarios-ms:

    # Configuração de build da imagem do contêiner.
    # O contexto aponta para o diretório raiz do código-fonte do microsserviço.
    # O Docker procurará um arquivo 'Dockerfile' nesta pasta.
    build: 
      context: ../backend/usuarios-ms
      
    # Nome atribuído ao contêiner para facilitar a identificação e comandos via terminal.
    container_name: biblioteca_usuarios_ms
    
    # Política de reinicialização.
    # Se o microsserviço falhar (ex: erro temporário de conexão), 
    # o Docker tentará reiniciá-lo automaticamente sem derrubar os demais contêineres.
    restart: on-failure
    
    # Mapeamento de portas.
    # Formato: PORTA_DO_HOST:PORTA_DO_CONTÊINER
    # O serviço estará acessível externamente pela porta 8081.
    ports:
      - "8081:8081"

    # Carrega variáveis definidas no arquivo .env do microsserviço.
    # O Docker Compose lê este arquivo no momento da criação do container
    # e disponibiliza as variáveis como variáveis de ambiente.
    env_file:
      - ../backend/usuarios-ms/.env
      
    # Variáveis de ambiente que sobrescrevem as configurações do application.properties.
    # Isso permite que o serviço se conecte à infraestrutura rodando dentro do Docker.
    # O Spring Boot faz a tradução automática entre o SPRING_DATASOURCE_URL do docker-compose e o spring.datasource.url do application.properties.
    environment:
      # URL de conexão com o banco de dados.
      # Utiliza o nome do serviço "postgres" definido na rede Docker.
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/biblioteca?currentSchema=usuarios
      # Host do RabbitMQ na rede Docker.
      - SPRING_RABBITMQ_HOST=rabbitmq

      # URLs dos outros microsserviços na rede Docker
      - SERVICES_EMPRESTIMOS_URL=http://emprestimos-ms:8083
      
      # Fuso horário do sistema do container (America/Bahia = UTC-3)
      - TZ=America/Bahia

      # Fuso horário usado pelo PostgreSQL para timestamps
      - PGTZ=America/Bahia

      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB=DEBUG

    # Aguarda o banco, a criação dos schemas e a mensageria.
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
        
    # Rede Docker onde o serviço será conectado, permitindo comunicação com a infraestrutura.
    networks:
      - biblioteca_network