      created: 1784687000001
      modified: 1784687000001
      isPrivate: false
      description: "Caminho Feliz"
      sortKey: -1784687001000
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "cpf": "11111111111",
          "nome": "Usuario Teste 1",
          "email": "user1@biblioteca.com",
          "senha": "user123",
          "role": "USER"
        }
    headers:
      - name: Content-Type
        value: application/json
      - name: User-Agent
        value: insomnia/12.6.0
        description: ""
        disabled: false
    scripts:
      afterResponse: |-
        const json = insomnia.response.json();

        if (insomnia.response.code === 201) {
          insomnia.environment.set('user1_id', json.id);
          insomnia.environment.set('user1_email', json.email);
        }
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true

