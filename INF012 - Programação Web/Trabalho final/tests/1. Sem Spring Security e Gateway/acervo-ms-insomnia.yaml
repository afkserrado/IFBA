    body:
      mimeType: application/json
      text: |-
        {
          "cpf": "22222222222",
          "nome": "Usuario Teste Acervo",
          "email": "teste.acervo@biblioteca.com",
          "senha": "user123",
          "role": "USER"
        }
    headers:
      - name: Content-Type
        value: application/json
      - name: User-Agent
        value: insomnia/12.6.0
    scripts:
      afterResponse: |-
        const json = insomnia.response.json();
        if (insomnia.response.code === 201) {
          insomnia.environment.set('usuario_acervo_id', json.id);
        }
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
