  - url: http://localhost:8083/api/v1/emprestimos/{{ _.emprestimo_a_id }}/devolucao
    name: 7. Registrar devolução do empréstimo A com atraso
    meta:
      id: req_emprestimos_clean_007
      created: 1784691000007
      modified: 1784691000007
      isPrivate: false
    description: "Devolve o empréstimo após a simulação de atraso. Esperado: 200 OK com multa pendente."
    sortKey: -1784690000940
    method: POST
    headers:
      - name: User-Agent
        value: insomnia/12.6.0
    scripts:
      afterResponse: |-
        if (insomnia.response.code !== 200) {
          throw new Error(
            `Esperado HTTP 200, recebido HTTP ${insomnia.response.code}`
          );
        }

        const json = insomnia.response.json();

        if (json.status !== "DEVOLVIDO") {
          throw new Error(
            `Esperado status DEVOLVIDO, recebido ${json.status}`
          );
        }

        if (Number(json.valorMulta) <= 0) {
          throw new Error(
            "A devolução deveria ter gerado uma multa maior que zero."
          );
        }

        if (json.multaPaga !== false) {
          throw new Error(
            "A multa deveria estar pendente após a devolução."
          );
        }
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true

