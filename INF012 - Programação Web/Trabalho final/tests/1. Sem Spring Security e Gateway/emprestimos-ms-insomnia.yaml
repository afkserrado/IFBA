      created: 1784691000008
      modified: 1784691000008
      isPrivate: false
    description: "Marca a multa como paga. Esperado: 200 OK."
    sortKey: -1784690000920
    method: POST
    headers:
      - name: User-Agent
        value: insomnia/12.6.0
    scripts:
      afterResponse: |-
        if (insomnia.response.code !== 200) {
          throw new Error(
            `Esperado HTTP 200, recebido HTTP ${insomnia.response.code}`
          );
        }

        const json = insomnia.response.json();

        if (json.multaPaga !== true) {
          throw new Error(
            "A resposta não confirmou o pagamento da multa."
          );
        }

        if (Number(json.valorMulta) <= 0) {
          throw new Error(
            "O valor da multa deveria permanecer registrado."
          );
        }
    settings:
      renderRequestBody: true
      encodeUrl: true
