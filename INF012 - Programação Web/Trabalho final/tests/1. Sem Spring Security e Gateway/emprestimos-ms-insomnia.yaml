    meta:
      id: req_emprestimos_clean_000
      created: 1784691000000
      modified: 1784691000000
      isPrivate: false
    description: "Caminho Feliz — Esperado: 201 Created."
    sortKey: -1784690001010
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "cpf": "11111111111",
          "nome": "Usuario Teste Emprestimos",
          "email": "teste.emprestimos@biblioteca.com",
          "senha": "user123",
          "role": "USER"
        }
    headers:
      - name: Content-Type
        value: application/json
      - name: User-Agent
        value: insomnia/12.6.0
    scripts:
      afterResponse: |-
        const json = insomnia.response.json();
        if (insomnia.response.code === 201) {
          insomnia.environment.set('usuario_id', json.id);
        }
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true

