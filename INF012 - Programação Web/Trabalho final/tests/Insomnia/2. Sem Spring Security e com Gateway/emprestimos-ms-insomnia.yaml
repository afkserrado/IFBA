  - url: http://localhost:8080/api/v1/emprestimos/{{ _.emprestimo_a_id }}/simular-atraso?dataPrevistaDevolucao=2026-09-01T00:00:00
    name: 06a. Simular atraso no empréstimo A
    meta:
      id: req_emprestimos_clean_006a
      created: 1784691000007
      modified: 1784691000007
      isPrivate: false
    description: "Apenas para testes — altera a data prevista para uma data passada. Esperado: 200 OK."
    sortKey: -1784690000945
    method: PUT
    headers:
      - name: User-Agent
        value: insomnia/12.6.0
    scripts:
      afterResponse: |-
        if (insomnia.response.code !== 200) {
          throw new Error(
            `Esperado HTTP 200, recebido HTTP ${insomnia.response.code}`
          );
        }


        const json = insomnia.response.json();


        if (json.dataPrevistaDevolucao !== "2026-09-01T00:00:00") {
          throw new Error(
            "A data prevista de devolução não foi atualizada corretamente."
          );
        }
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true


