        value: insomnia/12.6.0
    scripts:
      afterResponse: |-
        if (insomnia.response.code !== 200) {
          throw new Error(
            `Esperado HTTP 200, recebido HTTP ${insomnia.response.code}`
          );
        }


        const json = insomnia.response.json();


        if (json.multaPaga !== true) {
          throw new Error(
