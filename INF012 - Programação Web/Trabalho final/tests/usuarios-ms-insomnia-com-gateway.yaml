type: collection.insomnia.rest/5.0
schema_version: "5.1"
name: Usuarios MS - Suíte Completa de Testes
meta:
  id: wrk_usuarios_ms_completo
  created: 1784680877117
  modified: 1784739034569
  description: "Testes dos endpoints do microsserviço de usuários cobrindo permissões para ADMIN e USER via API Gateway"
collection:
  - url: http://localhost:8080/auth/login
    name: 01. Login do ADMIN inicial
    meta:
      id: req_usr_001
      created: 1784678512655
      modified: 1784681120990
      isPrivate: false
      description: "Obtém o token JWT do administrador padrão do sistema"
      sortKey: -1000
    method: POST
    body:
      mimeType: application/json
      text: |-
        {
          "email": "admin@biblioteca.com",
          "senha": "admin123"
        }
    headers:
      - name: Content-Type
        value: application/json
      - name: User-Agent
        value: insomnia/12.6.0
    scripts:
      afterResponse: |-
        const json = insomnia.response.json();
        if (insomnia.response.code === 200) {
          insomnia.environment.set('token_admin', json.token);
          insomnia.environment.set('admin_id', json.usuario.id);
        }
    settings:
      renderRequestBody: true
      encodeUrl: true
      followRedirects: global
      cookies:
        send: true
        store: true
      rebuildPath: true

