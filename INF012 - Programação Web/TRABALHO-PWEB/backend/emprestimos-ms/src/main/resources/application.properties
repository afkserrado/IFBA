# ============================
# Identificação da aplicação
# ============================

# Nome do microsserviço
spring.application.name=emprestimos-ms

# Porta HTTP da aplicação
server.port=8083

# ============================
# Banco de dados PostgreSQL
# ============================

# URL de conexão com o banco
spring.datasource.url=jdbc:postgresql://localhost:5433/biblioteca?currentSchema=emprestimos

# Credenciais do banco
spring.datasource.username=admin
spring.datasource.password=biblioteca

# Driver JDBC
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================
# JPA / Hibernate
# ============================

# Atualiza automaticamente o schema conforme as entidades
spring.jpa.hibernate.ddl-auto=update

# Exibe SQL gerado pelo Hibernate
spring.jpa.show-sql=true

# Formata os comandos SQL exibidos no console
spring.jpa.properties.hibernate.format_sql=true

# Schema padrão utilizado pelo Hibernate
spring.jpa.properties.hibernate.default_schema=emprestimos

# ============================
# RabbitMQ
# ============================

# Servidor RabbitMQ
spring.rabbitmq.host=localhost

# Porta AMQP
spring.rabbitmq.port=5672

# Credenciais RabbitMQ
spring.rabbitmq.username=admin
spring.rabbitmq.password=biblioteca

# ============================
# Comunicação entre microsserviços
# ============================

# URL do microsserviço de usuários
microservice.usuarios.url=http://localhost:8081

# URL do microsserviço de acervo
microservice.acervo.url=http://localhost:8082

# ============================
# Segurança JWT
# ============================

security.public-paths=/swagger-ui/**,/v3/api-docs/**
security.jwt-secret=minha-chave-secreta-super-protegida-com-mais-de-trinta-e-dois-bytes

# ============================
# Logs Spring Security
# ============================

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.web.FilterChainProxy=TRACE